<!DOCTYPE html>
<html>
<head><title>Test IA</title></head>
<body>
    <h2>Probar detección NSFW</h2>
    <form id="testForm" enctype="multipart/form-data">
        <input type="file" id="imagen" accept="image/*">
        <button type="submit">Probar</button>
    </form>
    <pre id="resultado"></pre>
    <script>
        const WORKER_URL = "https://subir-fotos-worker.yvellaurore02.workers.dev";
        document.getElementById('testForm').onsubmit = async (e) => {
            e.preventDefault();
            const file = document.getElementById('imagen').files[0];
            const formData = new FormData();
            formData.append('imagen', file);
            const res = await fetch(`${WORKER_URL}/debug/ia`, { method: 'POST', body: formData });
            const data = await res.json();
            document.getElementById('resultado').innerHTML = JSON.stringify(data, null, 2);
        };
    </script>
</body>
</html>
