<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Moderación - Intercambia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, 'Segoe UI', sans-serif;
            background: #1e293b;
            padding: 24px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 32px;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }
        .stat-card {
            background: #0f172a;
            border-radius: 20px;
            padding: 20px 32px;
            text-align: center;
            flex: 1;
            min-width: 150px;
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #10b981;
        }
        .stat-label {
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .seccion {
            background: #0f172a;
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 32px;
        }
        .seccion h2 {
            color: white;
            margin-bottom: 20px;
            font-size: 1.3rem;
            border-left: 4px solid #10b981;
            padding-left: 16px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }
        .objeto-card {
            background: #1e293b;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .objeto-card.sospechoso {
            border-left: 4px solid #f59e0b;
        }
        .objeto-card.reportado {
            border-left: 4px solid #ef4444;
        }
        .objeto-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .info {
            padding: 16px;
        }
        .info h3 {
            color: white;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .info p {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 60px;
            font-size: 11px;
            font-weight: 600;
            margin: 4px 4px 4px 0;
        }
        .badge-sospechoso {
            background: #f59e0b;
            color: #1e293b;
        }
        .badge-reportado {
            background: #ef4444;
            color: white;
        }
        .badge-usuario {
            background: #3b82f6;
            color: white;
        }
        .motivo {
            background: #334155;
            padding: 10px;
            border-radius: 12px;
            font-size: 12px;
            margin: 12px 0;
            color: #cbd5e1;
        }
        .botones {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .btn-aprobar {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            flex: 1;
        }
        .btn-aprobar:hover {
            background: #059669;
        }
        .btn-bloquear {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            flex: 1;
        }
        .btn-bloquear:hover {
            background: #dc2626;
        }
        .vacio {
            text-align: center;
            padding: 40px;
            color: #64748b;
            background: #1e293b;
            border-radius: 20px;
        }
        .refresh-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 24px;
        }
        .refresh-btn:hover {
            background: #059669;
        }
        .error-message {
            background: #7f1d1d;
            color: #fecaca;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔒 Panel de Moderación</h1>
    <div class="subtitle">Revisa y modera el contenido reportado o sospechoso</div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" id="totalSospechosos">-</div>
            <div class="stat-label">Pendientes por IA</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalReportados">-</div>
            <div class="stat-label">Reportes de usuarios</div>
        </div>
    </div>

    <button class="refresh-btn" id="refreshBtn">🔄 Actualizar</button>

    <div id="contenidoModeracion"></div>
</div>

<script>
    const WORKER_URL = "https://subir-fotos-worker.yvellaurore02.workers.dev";

    async function cargarPendientes() {
        try {
            // Llamada directa al Worker (sin autenticación)
            const response = await fetch(`${WORKER_URL}/moderacion/pendientes`);
            
            if (!response.ok) {
                const error = await response.text();
                throw new Error(error || 'Error al cargar');
            }
            
            const datos = await response.json();
            
            document.getElementById('totalSospechosos').innerText = datos.sospechosos?.length || 0;
            document.getElementById('totalReportados').innerText = datos.reportados?.length || 0;
            
            let html = '';
            
            // SECCIÓN: SOSPECHOSOS (IA)
            html += `<div class="seccion"><h2>🤖 Detectados por IA</h2>`;
            if (!datos.sospechosos || datos.sospechosos.length === 0) {
                html += `<div class="vacio">✅ No hay objetos sospechosos pendientes</div>`;
            } else {
                html += `<div class="grid">`;
                for (const obj of datos.sospechosos) {
                    html += `
                        <div class="objeto-card sospechoso">
                            <img src="${obj.url}" alt="${escapeHtml(obj.titulo)}" onerror="this.src='https://via.placeholder.com/300x200?text=Imagen+no+disponible'">
                            <div class="info">
                                <h3>${escapeHtml(obj.titulo)}</h3>
                                <p>${escapeHtml(obj.descripcion?.substring(0, 100))}</p>
                                <span class="badge badge-sospechoso">⚠️ Sospechoso (IA)</span>
                                <span class="badge badge-usuario">👤 ${escapeHtml(obj.usuario)}</span>
                                <div class="motivo"><strong>Motivo IA:</strong> ${escapeHtml(obj.motivo_sospecha || 'NSFW detectado')}</div>
                                <div class="botones">
                                    <button class="btn-aprobar" data-id="${obj.id}">✅ Aprobar</button>
                                    <button class="btn-bloquear" data-id="${obj.id}">❌ Bloquear</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
                html += `</div>`;
            }
            html += `</div>`;
            
            // SECCIÓN: REPORTADOS POR USUARIOS
            html += `<div class="seccion"><h2>📢 Reportados por usuarios</h2>`;
            if (!datos.reportados || datos.reportados.length === 0) {
                html += `<div class="vacio">✅ No hay objetos reportados pendientes</div>`;
            } else {
                html += `<div class="grid">`;
                for (const obj of datos.reportados) {
                    html += `
                        <div class="objeto-card reportado">
                            <img src="${obj.url}" alt="${escapeHtml(obj.titulo)}" onerror="this.src='https://via.placeholder.com/300x200?text=Imagen+no+disponible'">
                            <div class="info">
                                <h3>${escapeHtml(obj.titulo)}</h3>
                                <p>${escapeHtml(obj.descripcion?.substring(0, 100))}</p>
                                <span class="badge badge-reportado">📢 Reportado</span>
                                <span class="badge badge-usuario">👤 ${escapeHtml(obj.usuario)}</span>
                                <div class="motivo"><strong>Motivo del reporte:</strong> ${escapeHtml(obj.motivo_reporte)}<br><small>Reportado por: ${escapeHtml(obj.reportado_por)}</small></div>
                                <div class="botones">
                                    <button class="btn-aprobar" data-id="${obj.id}">✅ Aprobar</button>
                                    <button class="btn-bloquear" data-id="${obj.id}">❌ Bloquear</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
                html += `</div>`;
            }
            html += `</div>`;
            
            document.getElementById('contenidoModeracion').innerHTML = html;
            
            document.querySelectorAll('.btn-aprobar').forEach(btn => {
                btn.addEventListener('click', () => moderar(btn.dataset.id, 'aprobar'));
            });
            document.querySelectorAll('.btn-bloquear').forEach(btn => {
                btn.addEventListener('click', () => moderar(btn.dataset.id, 'bloquear'));
            });
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('contenidoModeracion').innerHTML = `<div class="error-message">❌ Error al cargar: ${error.message}<br><br>Asegúrate de que el Worker tiene el endpoint /moderacion/pendientes</div>`;
        }
    }

    async function moderar(id, accion) {
        const confirmar = confirm(`¿Estás seguro de ${accion === 'aprobar' ? 'aprobar' : 'bloquear y eliminar'} esta publicación?`);
        if (!confirmar) return;
        
        try {
            const response = await fetch(`${WORKER_URL}/moderacion/decidir`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: parseInt(id), accion })
            });
            if (!response.ok) throw new Error('Error al guardar');
            alert(`✅ Publicación ${accion === 'aprobar' ? 'aprobada' : 'bloqueada y eliminada'}`);
            cargarPendientes();
        } catch (error) {
            alert('❌ Error: ' + error.message);
        }
    }

    document.getElementById('refreshBtn').addEventListener('click', () => cargarPendientes());

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Cargar al iniciar
    cargarPendientes();
</script>
</body>
</html>
