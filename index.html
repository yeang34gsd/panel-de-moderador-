<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 Panel de Moderación - Intercambia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { color: white; margin-bottom: 10px; }
        .subtitle { color: #aaa; margin-bottom: 30px; }
        .seccion {
            background: white;
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .seccion h2 {
            color: #1a472a;
            margin-bottom: 20px;
            border-left: 4px solid #1a472a;
            padding-left: 15px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }
        .objeto-card {
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
            background: #fefefe;
        }
        .objeto-card.sospechoso { border-left: 5px solid #e67e22; }
        .objeto-card.reportado { border-left: 5px solid #e74c3c; }
        .objeto-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .info { padding: 16px; }
        .info h3 { font-size: 1.2rem; margin-bottom: 8px; color: #1e293b; }
        .info p { color: #475569; font-size: 0.9rem; margin-bottom: 12px; }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 60px;
            font-size: 12px;
            font-weight: 600;
            margin: 4px 4px 4px 0;
        }
        .badge-sospechoso { background: #fef3c7; color: #92400e; }
        .badge-reportado { background: #fee2e2; color: #991b1b; }
        .badge-usuario { background: #e0e7ff; color: #3730a3; }
        .motivo {
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 13px;
            margin: 12px 0;
            border-left: 3px solid #94a3b8;
        }
        .botones { display: flex; gap: 12px; margin-top: 16px; }
        .btn-aprobar { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 40px; cursor: pointer; flex: 1; }
        .btn-aprobar:hover { background: #059669; }
        .btn-bloquear { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 40px; cursor: pointer; flex: 1; }
        .btn-bloquear:hover { background: #dc2626; }
        .vacio { text-align: center; padding: 40px; color: #64748b; background: #f8fafc; border-radius: 20px; }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-card { background: white; border-radius: 16px; padding: 16px 24px; text-align: center; flex: 1; min-width: 120px; }
        .stat-number { font-size: 2rem; font-weight: bold; color: #1a472a; }
        .stat-label { color: #64748b; font-size: 0.85rem; }
        .refresh-btn { background: #1a472a; color: white; border: none; padding: 10px 20px; border-radius: 40px; cursor: pointer; margin-bottom: 20px; }
        .login-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            margin: 50px auto;
        }
        .google-btn {
            background: #4285f4;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 24px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div id="loginPanel" style="display: none;">
        <div class="login-card">
            <h2>🔐 Acceso al Panel de Moderación</h2>
            <p>Inicia sesión con tu cuenta de Google para acceder</p>
            <button id="googleLoginBtn" class="google-btn">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="white" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="white" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="white" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="white" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Iniciar sesión con Google
            </button>
        </div>
    </div>

    <div id="modPanel" style="display: none;">
        <h1>🔒 Panel de Moderación</h1>
        <div class="subtitle">Revisa contenido sospechoso y reportado. Tú decides si aprobar o bloquear.</div>

        <div class="stats" id="stats">
            <div class="stat-card"><div class="stat-number" id="totalSospechosos">-</div><div class="stat-label">Pendientes (IA)</div></div>
            <div class="stat-card"><div class="stat-number" id="totalReportados">-</div><div class="stat-label">Pendientes (Reportes)</div></div>
        </div>

        <button class="refresh-btn" id="refreshBtn">🔄 Actualizar</button>
        <div id="contenido"></div>
    </div>
</div>

<script>
    const WORKER_URL = "https://subir-fotos-worker.yvellaurore02.workers.dev";
    let authToken = null;
    let currentUser = null;

    function getTokenFromURL() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        if (token) {
            localStorage.setItem('mod_token', token);
            window.history.replaceState({}, document.title, window.location.pathname);
            return token;
        }
        return localStorage.getItem('mod_token');
    }

    async function verifyToken(token) {
        try {
            const response = await fetch(`${WORKER_URL}/auth/me`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!response.ok) return null;
            const data = await response.json();
            return data.user;
        } catch (e) { return null; }
    }

    function loginWithGoogle() {
        window.location.href = `${WORKER_URL}/auth/google?redirect=${encodeURIComponent(window.location.href)}`;
    }

    async function cargarPendientes() {
        if (!authToken) return;

        try {
            const response = await fetch(`${WORKER_URL}/moderacion/pendientes`, {
                headers: { 'Authorization': `Bearer ${authToken}` }
            });
            
            if (response.status === 403) {
                document.getElementById('contenido').innerHTML = `<div class="vacio">⛔ No tienes permiso para acceder a este panel. Solo el moderador puede entrar.</div>`;
                return;
            }
            
            if (!response.ok) throw new Error('Error al cargar');
            const datos = await response.json();
            
            document.getElementById('totalSospechosos').innerText = datos.sospechosos?.length || 0;
            document.getElementById('totalReportados').innerText = datos.reportados?.length || 0;
            
            let html = '';
            
            // Sospechosos
            html += `<div class="seccion"><h2>🤖 Detectados por IA (sospechosos)</h2>`;
            if (!datos.sospechosos || datos.sospechosos.length === 0) {
                html += `<div class="vacio">✅ No hay objetos sospechosos pendientes</div>`;
            } else {
                html += `<div class="grid">`;
                for (const obj of datos.sospechosos) {
                    html += `
                        <div class="objeto-card sospechoso" data-id="${obj.id}">
                            <img src="${obj.url}" onerror="this.src='https://via.placeholder.com/300x200?text=Imagen'">
                            <div class="info">
                                <h3>${escapeHtml(obj.titulo)}</h3>
                                <p>${escapeHtml(obj.descripcion?.substring(0, 100))}</p>
                                <span class="badge badge-sospechoso">⚠️ Sospechoso (IA)</span>
                                <span class="badge badge-usuario">👤 ${escapeHtml(obj.usuario)}</span>
                                <div class="motivo"><strong>🤖 Motivo IA:</strong> ${escapeHtml(obj.motivo_sospecha || 'NSFW detectado')}</div>
                                <div class="botones">
                                    <button class="btn-aprobar" data-id="${obj.id}">✅ Aprobar</button>
                                    <button class="btn-bloquear" data-id="${obj.id}">❌ Bloquear</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
                html += `</div>`;
            }
            html += `</div>`;
            
            // Reportados
            html += `<div class="seccion"><h2>📢 Reportados por usuarios</h2>`;
            if (!datos.reportados || datos.reportados.length === 0) {
                html += `<div class="vacio">✅ No hay objetos reportados pendientes</div>`;
            } else {
                html += `<div class="grid">`;
                for (const obj of datos.reportados) {
                    html += `
                        <div class="objeto-card reportado" data-id="${obj.id}">
                            <img src="${obj.url}" onerror="this.src='https://via.placeholder.com/300x200?text=Imagen'">
                            <div class="info">
                                <h3>${escapeHtml(obj.titulo)}</h3>
                                <p>${escapeHtml(obj.descripcion?.substring(0, 100))}</p>
                                <span class="badge badge-reportado">📢 Reportado</span>
                                <span class="badge badge-usuario">👤 ${escapeHtml(obj.usuario)}</span>
                                <div class="motivo"><strong>🗣️ Motivo:</strong> ${escapeHtml(obj.motivo_reporte)}<br><small>Reportado por: ${escapeHtml(obj.reportado_por)}</small></div>
                                <div class="botones">
                                    <button class="btn-aprobar" data-id="${obj.id}">✅ Aprobar</button>
                                    <button class="btn-bloquear" data-id="${obj.id}">❌ Bloquear</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
                html += `</div>`;
            }
            html += `</div>`;
            
            document.getElementById('contenido').innerHTML = html;
            
            document.querySelectorAll('.btn-aprobar').forEach(btn => {
                btn.addEventListener('click', () => moderar(btn.dataset.id, 'aprobar'));
            });
            document.querySelectorAll('.btn-bloquear').forEach(btn => {
                btn.addEventListener('click', () => moderar(btn.dataset.id, 'bloquear'));
            });
        } catch (error) {
            console.error(error);
            document.getElementById('contenido').innerHTML = `<div class="vacio">❌ Error al cargar: ${error.message}</div>`;
        }
    }
    
    async function moderar(id, accion) {
        if (!authToken) return;
        
        if (!confirm(`¿Estás seguro de ${accion === 'aprobar' ? 'aprobar' : 'bloquear'} esta publicación?`)) return;
        
        try {
            const response = await fetch(`${WORKER_URL}/moderacion/decidir`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                body: JSON.stringify({ id: parseInt(id), accion })
            });
            if (!response.ok) throw new Error('Error');
            alert(`✅ Publicación ${accion === 'aprobar' ? 'aprobada' : 'bloqueada'}`);
            cargarPendientes();
        } catch (error) {
            alert('❌ Error: ' + error.message);
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }
    
    document.getElementById('refreshBtn').addEventListener('click', cargarPendientes);
    document.getElementById('googleLoginBtn').addEventListener('click', loginWithGoogle);
    
    async function init() {
        const token = getTokenFromURL();
        if (token) {
            authToken = token;
            const user = await verifyToken(token);
            if (user) {
                currentUser = user;
                document.getElementById('loginPanel').style.display = 'none';
                document.getElementById('modPanel').style.display = 'block';
                cargarPendientes();
            } else {
                localStorage.removeItem('mod_token');
                document.getElementById('loginPanel').style.display = 'block';
                document.getElementById('modPanel').style.display = 'none';
            }
        } else {
            document.getElementById('loginPanel').style.display = 'block';
            document.getElementById('modPanel').style.display = 'none';
        }
    }
    
    init();
</script>
</body>
</html>
