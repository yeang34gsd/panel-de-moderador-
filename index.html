<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 Panel de Moderación - Intercambia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, 'Segoe UI', sans-serif; background: #1a1a2e; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { color: white; margin-bottom: 10px; }
        .subtitle { color: #aaa; margin-bottom: 30px; }
        .seccion { background: white; border-radius: 24px; padding: 24px; margin-bottom: 40px; }
        .seccion h2 { color: #1a472a; margin-bottom: 20px; border-left: 4px solid #1a472a; padding-left: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
        .objeto-card { border: 1px solid #e2e8f0; border-radius: 20px; overflow: hidden; background: #fefefe; }
        .objeto-card.sospechoso { border-left: 5px solid #e67e22; }
        .objeto-card.reportado { border-left: 5px solid #e74c3c; }
        .objeto-card img { width: 100%; height: 200px; object-fit: cover; }
        .info { padding: 16px; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 60px; font-size: 12px; font-weight: 600; margin: 4px; }
        .badge-sospechoso { background: #fef3c7; color: #92400e; }
        .badge-reportado { background: #fee2e2; color: #991b1b; }
        .motivo { background: #f8fafc; padding: 8px 12px; border-radius: 12px; font-size: 13px; margin: 12px 0; border-left: 3px solid #94a3b8; }
        .botones { display: flex; gap: 12px; margin-top: 16px; }
        .btn-aprobar { background: #10b981; color: white; border: none; padding: 10px; border-radius: 40px; cursor: pointer; flex: 1; }
        .btn-bloquear { background: #ef4444; color: white; border: none; padding: 10px; border-radius: 40px; cursor: pointer; flex: 1; }
        .vacio { text-align: center; padding: 40px; color: #64748b; background: #f8fafc; border-radius: 20px; }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-card { background: white; border-radius: 16px; padding: 16px 24px; text-align: center; flex: 1; }
        .stat-number { font-size: 2rem; font-weight: bold; color: #1a472a; }
        .refresh-btn { background: #1a472a; color: white; border: none; padding: 10px 20px; border-radius: 40px; cursor: pointer; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔒 Panel de Moderación</h1>
    <div class="subtitle">Revisa contenido sospechoso y reportado.</div>

    <div class="stats">
        <div class="stat-card"><div class="stat-number" id="totalSospechosos">-</div><div>Pendientes IA</div></div>
        <div class="stat-card"><div class="stat-number" id="totalReportados">-</div><div>Pendientes Reportes</div></div>
    </div>

    <button class="refresh-btn" id="refreshBtn">🔄 Actualizar</button>
    <div id="contenido"></div>
</div>

<script>
    const WORKER_URL = "https://subir-fotos-worker.yvellaurore02.workers.dev";
    let authToken = null;

    function getTokenFromURL() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        if (token) {
            localStorage.setItem('mod_token', token);
            window.history.replaceState({}, document.title, window.location.pathname);
            return token;
        }
        return localStorage.getItem('mod_token');
    }

    async function verifyToken(token) {
        try {
            const response = await fetch(`${WORKER_URL}/auth/me`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!response.ok) return null;
            const data = await response.json();
            return data.user;
        } catch (e) { return null; }
    }

    function loginWithGoogle() {
        window.location.href = `${WORKER_URL}/auth/google?redirect=${encodeURIComponent(window.location.href)}`;
    }

    async function cargarPendientes() {
        if (!authToken) return;

        try {
            const response = await fetch(`${WORKER_URL}/moderacion/pendientes`, {
                headers: { 'Authorization': `Bearer ${authToken}` }
            });
            
            if (response.status === 403) {
                document.getElementById('contenido').innerHTML = `<div class="vacio">⛔ No tienes permiso. Solo el moderador puede acceder.</div>`;
                return;
            }
            
            if (!response.ok) throw new Error('Error al cargar');
            const datos = await response.json();
            
            document.getElementById('totalSospechosos').innerText = datos.sospechosos?.length || 0;
            document.getElementById('totalReportados').innerText = datos.reportados?.length || 0;
            
            let html = '';
            
            // Sospechosos
            html += `<div class="seccion"><h2>🤖 Detectados por IA</h2>`;
            if (!datos.sospechosos || datos.sospechosos.length === 0) {
                html += `<div class="vacio">✅ No hay objetos sospechosos</div>`;
            } else {
                html += `<div class="grid">`;
                for (const obj of datos.sospechosos) {
                    html += `
                        <div class="objeto-card sospechoso">
                            <img src="${obj.url}" onerror="this.src='https://via.placeholder.com/300x200'">
                            <div class="info">
                                <h3>${escapeHtml(obj.titulo)}</h3>
                                <p>${escapeHtml(obj.descripcion?.substring(0, 100))}</p>
                                <span class="badge badge-sospechoso">⚠️ Sospechoso IA</span>
                                <span class="badge">👤 ${escapeHtml(obj.usuario)}</span>
                                <div class="motivo"><strong>Motivo:</strong> ${escapeHtml(obj.motivo_sospecha || 'NSFW detectado')}</div>
                                <div class="botones">
                                    <button class="btn-aprobar" data-id="${obj.id}">✅ Aprobar</button>
                                    <button class="btn-bloquear" data-id="${obj.id}">❌ Bloquear</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
                html += `</div>`;
            }
            html += `</div>`;
            
            // Reportados
            html += `<div class="seccion"><h2>📢 Reportados por usuarios</h2>`;
            if (!datos.reportados || datos.reportados.length === 0) {
                html += `<div class="vacio">✅ No hay objetos reportados</div>`;
            } else {
                html += `<div class="grid">`;
                for (const obj of datos.reportados) {
                    html += `
                        <div class="objeto-card reportado">
                            <img src="${obj.url}" onerror="this.src='https://via.placeholder.com/300x200'">
                            <div class="info">
                                <h3>${escapeHtml(obj.titulo)}</h3>
                                <p>${escapeHtml(obj.descripcion?.substring(0, 100))}</p>
                                <span class="badge badge-reportado">📢 Reportado</span>
                                <span class="badge">👤 ${escapeHtml(obj.usuario)}</span>
                                <div class="motivo"><strong>Motivo:</strong> ${escapeHtml(obj.motivo_reporte)}<br><small>Reportado por: ${escapeHtml(obj.reportado_por)}</small></div>
                                <div class="botones">
                                    <button class="btn-aprobar" data-id="${obj.id}">✅ Aprobar</button>
                                    <button class="btn-bloquear" data-id="${obj.id}">❌ Bloquear</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
                html += `</div>`;
            }
            html += `</div>`;
            
            document.getElementById('contenido').innerHTML = html;
            
            document.querySelectorAll('.btn-aprobar').forEach(btn => {
                btn.addEventListener('click', () => moderar(btn.dataset.id, 'aprobar'));
            });
            document.querySelectorAll('.btn-bloquear').forEach(btn => {
                btn.addEventListener('click', () => moderar(btn.dataset.id, 'bloquear'));
            });
        } catch (error) {
            document.getElementById('contenido').innerHTML = `<div class="vacio">❌ Error: ${error.message}</div>`;
        }
    }
    
    async function moderar(id, accion) {
        if (!authToken) return;
        if (!confirm(`¿${accion === 'aprobar' ? 'Aprobar' : 'Bloquear'} esta publicación?`)) return;
        
        try {
            const response = await fetch(`${WORKER_URL}/moderacion/decidir`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                body: JSON.stringify({ id: parseInt(id), accion })
            });
            if (!response.ok) throw new Error('Error');
            alert(`✅ Publicación ${accion === 'aprobar' ? 'aprobada' : 'bloqueada'}`);
            cargarPendientes();
        } catch (error) {
            alert('❌ Error: ' + error.message);
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }
    
    document.getElementById('refreshBtn').addEventListener('click', cargarPendientes);
    
    async function init() {
        const token = getTokenFromURL();
        if (token) {
            authToken = token;
            const user = await verifyToken(token);
            if (user) {
                cargarPendientes();
            } else {
                localStorage.removeItem('mod_token');
                loginWithGoogle();
            }
        } else {
            loginWithGoogle();
        }
    }
    
    init();
</script>
</body>
</html>
